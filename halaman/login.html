<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Daftar</title>
    <link rel="stylesheet" href="/public/global.css"/>
    <link rel="stylesheet" href="/public/daftarlogin.css" />
</head>
<body>
    <div class="container">
        <div class="side-panel" id="sidePanel">
            <div id="sidePanelContent">
                <h2>Selamat Datang!</h2>
                <p>Belum punya akun? Daftar sekarang dan nikmati semua fitur yang kami sediakan.</p>
                <a class="switch-btn" href="/daftar">Daftar</a>
            </div>
        </div>

        <div class="form-panel">
            <div class="form-container active" id="loginForm">
                <h1>Masuk</h1>
                <p class="subtitle">Masukkan email dan password Anda</p>
                
                <div class="success-message" id="loginSuccess">
                    Login berhasil! Selamat datang kembali.
                </div>

                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label for="loginEmail">Username atau Email</label>
                        <input type="text" id="loginEmail" placeholder="username atau nama@email.com" required>
                    </div>

                    <div class="input-group">
                        <label for="loginPassword">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="loginPassword" placeholder="Masukkan password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="forgot-password">
                        <a href="#" onclick="alert('Fitur lupa password akan segera hadir!'); return false;">Lupa password?</a>
                    </div>

                    <button type="submit" class="submit-btn">Masuk</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/public/daftarlogin.js"></script>
</body>
</html>
