<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Quiz - LearningGraph</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/public/global.css"/>
    <link rel="stylesheet" href="/public/quiz-results.css"/>
</head>
<body>
    <div class="results-container">
        <!-- Loading State -->
        <div id="loadingState" class="loading-state">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Memuat hasil...</p>
        </div>

        <!-- Results Content -->
        <div id="resultsContent" class="results-content hidden">
            <!-- Header -->
            <div class="results-header">
                <div class="confetti" id="confetti"></div>
                <div class="score-display">
                    <div class="grade-badge" id="gradeBadge">A</div>
                    <h1 class="score-text"><span id="scoreValue">0</span> / <span id="totalScore">0</span></h1>
                    <p class="percentage-text"><span id="percentageValue">0</span>%</p>
                </div>
                <h2 id="quizTitle">Quiz Title</h2>
                <p id="quizSubject">Subject</p>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="correctAnswers">0</h3>
                        <p>Benar</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-times-circle"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="wrongAnswers">0</h3>
                        <p>Salah</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="timeSpent">0:00</h3>
                        <p>Waktu</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-star"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="xpEarned">0</h3>
                        <p>XP Diperoleh</p>
                    </div>
                </div>
            </div>

            <!-- Performance Message -->
            <div class="performance-message" id="performanceMessage">
                <i class="fas fa-trophy"></i>
                <p id="messageText">Kerja bagus!</p>
            </div>

            <!-- Answers Review -->
            <div class="answers-section">
                <h3><i class="fas fa-list-check"></i> Review Jawaban</h3>
                <div id="answersReview" class="answers-review"></div>
            </div>

            <!-- Actions -->
            <div class="results-actions">
                <button class="btn-secondary" onclick="goToGames()">
                    <i class="fas fa-arrow-left"></i> Kembali ke Games
                </button>
                <button class="btn-primary" onclick="retakeQuiz()">
                    <i class="fas fa-redo"></i> Coba Lagi
                </button>
                <button class="btn-primary" onclick="shareResults()">
                    <i class="fas fa-share"></i> Bagikan
                </button>
            </div>
        </div>
    </div>

    <script src="/public/quiz-results.js"></script>
</body>
</html>
