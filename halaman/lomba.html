<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearningGraph - Lomba</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/public/global.css"/>
    <link rel="stylesheet" href="/public/sidebar.css"/>
    <link rel="stylesheet" href="/public/lomba.css"/>
</head>
<body>
    <komponen sidebar />

    <main class="main-content">
        <section class="header">
            <h1><i class="fas fa-trophy"></i> Lomba</h1>
            <p class="muted">Daftar dan ikuti kompetisi edukatif</p>
            <div class="filter-section">
                <button class="filter-btn active" onclick="filterCompetition('all')">Semua</button>
                <button class="filter-btn" onclick="filterCompetition('ongoing')">Sedang Berlangsung</button>
                <button class="filter-btn" onclick="filterCompetition('upcoming')">Akan Datang</button>
                <button class="filter-btn" onclick="filterCompetition('finished')">Selesai</button>
            </div>
            <div class="competitions-grid" id="competitionsGrid"></div>
        </section>
    </main>

    <script src="/public/sidebar.js"></script>
    <script src="/public/lomba.js"></script>
</body>
</html>
