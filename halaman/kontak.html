<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - LearningGraph</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/public/global.css"/>
    <link rel="stylesheet" href="/public/navbar.css"/>
    <link rel="stylesheet" href="/public/nav-dash.css"/>
    <link rel="stylesheet" href="/public/kontak.css"/>
    <link rel="stylesheet" href="/public/footer.css"/>
</head>
<body>
    <komponen navbar />

    <main class="kontak-main">
        <!-- Hero Section -->
        <section class="kontak-hero">
            <h1>Hubungi Kami</h1>
            <p>Kami siap membantu menjawab pertanyaan dan masukan Anda</p>
        </section>

        <section class="kontak-content">
            <!-- Contact Info Cards -->
            <div class="contact-info-grid">
                <div class="contact-card">
                    <div class="contact-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <h3>Alamat</h3>
                    <p>Jl. Pendidikan No. 123<br>Jakarta, Indonesia 12345</p>
                </div>
                <div class="contact-card">
                    <div class="contact-icon">
                        <i class="fas fa-phone"></i>
                    </div>
                    <h3>Telepon</h3>
                    <p><a href="tel:+62215551234">+62 (21) 5551234</a><br><a href="tel:+62815551234">+62 (81) 5551234</a></p>
                </div>
                <div class="contact-card">
                    <div class="contact-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <h3>Email</h3>
                    <p><a href="mailto:info@learninggraph.id">info@learninggraph.id</a><br><a href="mailto:support@learninggraph.id">support@learninggraph.id</a></p>
                </div>
            </div>

            <!-- Social Media -->
            <div class="social-section">
                <h2>Ikuti Kami</h2>
                <div class="social-links">
                    <a href="#" class="social-link" title="Facebook">
                        <i class="fab fa-facebook"></i>
                    </a>
                    <a href="#" class="social-link" title="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="#" class="social-link" title="Twitter">
                        <i class="fab fa-twitter"></i>
                    </a>
                    <a href="#" class="social-link" title="YouTube">
                        <i class="fab fa-youtube"></i>
                    </a>
                    <a href="#" class="social-link" title="TikTok">
                        <i class="fab fa-tiktok"></i>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <komponen footer />

    <script src="/public/kontak.js"></script>
</body>
</html>
