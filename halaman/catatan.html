<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearningGraph - Catatan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/public/sidebar.css" />
    <link rel="stylesheet" href="/public/catatan.css"/>
    <link rel="stylesheet" href="/public/global.css"/>
</head>
<body>
    <komponen sidebar />

    <div class="main-content">
        <div class="header">
            <h1>📚 Catatan Belajar</h1>
            <p style="color: #666; margin-bottom: 15px;">Kelola dan organisir catatan belajarmu</p>

            <div class="header-actions">
                <button class="btn btn-primary" onclick="openModal()">
                    <i class="fas fa-plus"></i> Buat Catatan Baru
                </button>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Cari catatan..." onkeyup="searchCatatan()">
                    <i class="fas fa-search"></i>
                </div>
            </div>

            <div class="filter-section" style="margin-top: 15px;">
                <button class="filter-btn active" onclick="filterBySubject('all')">Semua</button>
                <button class="filter-btn" onclick="filterBySubject('Matematika')">Matematika</button>
                <button class="filter-btn" onclick="filterBySubject('Fisika')">Fisika</button>
                <button class="filter-btn" onclick="filterBySubject('Kimia')">Kimia</button>
                <button class="filter-btn" onclick="filterBySubject('Biologi')">Biologi</button>
                <button class="filter-btn" onclick="filterBySubject('Bahasa Indonesia')">B. Indonesia</button>
            </div>
        </div>

        <div class="catatan-grid" id="catatanGrid"></div>
        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fas fa-book-open"></i>
            <h3>Belum Ada Catatan</h3>
            <p>Mulai buat catatan pertamamu sekarang!</p>
        </div>
    </div>

    <div class="modal" id="catatanModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Buat Catatan Baru</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="catatanForm" onsubmit="saveCatatan(event)">
                <input type="hidden" id="catatanId">
                <div class="form-group">
                    <label>Judul Catatan *</label>
                    <input type="text" id="judul" required placeholder="Masukkan judul catatan...">
                </div>
                <div class="form-group">
                    <label>Mata Pelajaran *</label>
                    <select id="mataPelajaran" required>
                        <option value="">Pilih Mata Pelajaran</option>
                        <option value="Matematika">Matematika</option>
                        <option value="Fisika">Fisika</option>
                        <option value="Kimia">Kimia</option>
                        <option value="Biologi">Biologi</option>
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                        <option value="Sejarah">Sejarah</option>
                        <option value="Geografi">Geografi</option>
                        <option value="Ekonomi">Ekonomi</option>
                        <option value="Sosiologi">Sosiologi</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Konten Catatan *</label>
                    <textarea id="konten" required placeholder="Tulis catatan kamu di sini..."></textarea>
                </div>
                <div class="form-group">
                    <label>Tags (pisahkan dengan koma)</label>
                    <div class="tags-input" id="tagsInput">
                        <input type="text" placeholder="Tambah tag..." onkeypress="handleTagInput(event)">
                    </div>
                </div>
                <div class="form-group">
                    <label>Warna Catatan</label>
                    <div class="color-picker">
                        <div class="color-option selected" data-color="#667eea" style="background: #667eea" onclick="selectColor('#667eea')"></div>
                        <div class="color-option" data-color="#f093fb" style="background: #f093fb" onclick="selectColor('#f093fb')"></div>
                        <div class="color-option" data-color="#4facfe" style="background: #4facfe" onclick="selectColor('#4facfe')"></div>
                        <div class="color-option" data-color="#43e97b" style="background: #43e97b" onclick="selectColor('#43e97b')"></div>
                        <div class="color-option" data-color="#fa709a" style="background: #fa709a" onclick="selectColor('#fa709a')"></div>
                        <div class="color-option" data-color="#feca57" style="background: #feca57" onclick="selectColor('#feca57')"></div>
                    </div>
                    <input type="hidden" id="warna" value="#667eea">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button type="button" class="btn btn-secondary" style="flex: 0.5; font-size: 13px; padding: 8px 12px;" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn btn-primary" style="flex: 2; font-size: 17px; padding: 14px 28px;">
                        <i class="fas fa-save"></i> Simpan Catatan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/public/sidebar.js"></script>
    <script>
        let currentTags = [];
        let currentFilter = 'all';
        let allCatatan = [];

        window.addEventListener('load', () => {
            loadCatatan();
            loadUserInfo();
        });

        async function loadUserInfo() {
            try {
                const response = await fetch('/api/me');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('userName').textContent = data.data.user.displayName;
                    document.getElementById('userEmail').textContent = data.data.user.email;
                }
            } catch (e) {
                console.error('Error loading user info:', e);
            }
        }

        async function loadCatatan(filter = {}) {
            try {
                let url = '/api/catatan';
                const params = new URLSearchParams(filter);
                if (params.toString()) url += '?' + params.toString();
                const response = await fetch(url);
                const data = await response.json();
                if (data.success) {
                    allCatatan = data.data;
                    renderCatatan(allCatatan);
                } else {
                    renderCatatan([]);
                }
            } catch (e) {
                console.error('Error loading catatan:', e);
                alert('Gagal memuat catatan!');
            }
        }

        function renderCatatan(catatan) {
            const grid = document.getElementById('catatanGrid');
            const emptyState = document.getElementById('emptyState');
            if (catatan.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }
            grid.style.display = 'grid';
            emptyState.style.display = 'none';
            grid.innerHTML = catatan.map(c => `
                <div class="catatan-card ${c.isPinned ? 'pinned' : ''}" style="border-left-color: ${c.warna}">
                    <div class="card-header">
                        <div class="card-title">${c.judul}</div>
                        <div class="card-actions">
                            ${c.isPinned ? '<i class="fas fa-thumbtack" style="color: #ffd700;"></i>' : ''}
                            <button class="icon-btn" onclick="togglePin('${c._id}', ${!c.isPinned})" title="${c.isPinned ? 'Unpin' : 'Pin'}">
                                <i class="fas fa-thumbtack"></i>
                            </button>
                            <button class="icon-btn" onclick="editCatatan('${c._id}')" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="icon-btn" onclick="deleteCatatan('${c._id}')" title="Hapus">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-subject">${c.mataPelajaran}</div>
                    ${c.tags && c.tags.length > 0 ? `
                        <div class="card-tags">
                            ${c.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    ` : ''}
                    <div class="card-footer">
                        <span><i class="far fa-clock"></i> ${formatDate(c.lastEdited || c.updatedAt)}</span>
                    </div>
                </div>
            `).join('');
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Tanggal tidak tersedia';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return 'Tanggal tidak tersedia';
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            if (diff < 60) return 'Baru saja';
            if (diff < 3600) return Math.floor(diff / 60) + ' menit lalu';
            if (diff < 86400) return Math.floor(diff / 3600) + ' jam lalu';
            if (diff < 604800) return Math.floor(diff / 86400) + ' hari lalu';
            return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function openModal(id = null) {
            document.getElementById('catatanModal').classList.add('active');
            document.getElementById('catatanForm').reset();
            currentTags = [];
            renderTagsInput();
            if (id) {
                document.getElementById('modalTitle').textContent = 'Edit Catatan';
                loadCatatanDetail(id);
            } else {
                document.getElementById('modalTitle').textContent = 'Buat Catatan Baru';
                document.getElementById('catatanId').value = '';
            }
        }

        function closeModal() {
            document.getElementById('catatanModal').classList.remove('active');
        }

        async function loadCatatanDetail(id) {
            try {
                const response = await fetch(`/api/catatan/${id}`);
                const data = await response.json();
                if (data.success) {
                    const c = data.data;
                    document.getElementById('catatanId').value = c._id;
                    document.getElementById('judul').value = c.judul;
                    document.getElementById('mataPelajaran').value = c.mataPelajaran;
                    document.getElementById('konten').value = c.konten;
                    document.getElementById('warna').value = c.warna;
                    currentTags = c.tags || [];
                    renderTagsInput();
                    selectColor(c.warna);
                }
            } catch (e) {
                console.error('Error loading catatan detail:', e);
            }
        }

        async function saveCatatan(event) {
            event.preventDefault();
            const id = document.getElementById('catatanId').value;
            const data = {
                judul: document.getElementById('judul').value,
                mataPelajaran: document.getElementById('mataPelajaran').value,
                konten: document.getElementById('konten').value,
                tags: currentTags,
                warna: document.getElementById('warna').value
            };
            try {
                const url = id ? `/api/catatan/${id}` : '/api/catatan';
                const method = id ? 'PUT' : 'POST';
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.success) {
                    alert(result.message);
                    closeModal();
                    loadCatatan();
                } else {
                    alert(result.message);
                }
            } catch (e) {
                console.error('Error saving catatan:', e);
                alert('Gagal menyimpan catatan!');
            }
        }

        async function deleteCatatan(id) {
            if (!confirm('Yakin ingin menghapus catatan ini?')) return;
            try {
                const response = await fetch(`/api/catatan/${id}`, { method: 'DELETE' });
                const result = await response.json();
                if (result.success) {
                    alert(result.message);
                    loadCatatan();
                } else {
                    alert(result.message);
                }
            } catch (e) {
                console.error('Error deleting catatan:', e);
                alert('Gagal menghapus catatan!');
            }
        }

        async function togglePin(id, isPinned) {
            try {
                const response = await fetch(`/api/catatan/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isPinned })
                });
                const result = await response.json();
                if (result.success) loadCatatan();
            } catch (e) {
                console.error('Error toggling pin:', e);
            }
        }

        function editCatatan(id) {
            openModal(id);
        }

        function selectColor(color) {
            document.getElementById('warna').value = color;
            document.querySelectorAll('.color-option').forEach(opt => {
                opt.classList.remove('selected');
                if (opt.dataset && opt.dataset.color === color) opt.classList.add('selected');
            });
        }

        function handleTagInput(event) {
            if (event.key === 'Enter' || event.key === ',') {
                event.preventDefault();
                const input = event.target;
                const tag = input.value.trim();
                if (tag && !currentTags.includes(tag)) {
                    currentTags.push(tag);
                    renderTagsInput();
                }
                input.value = '';
            }
        }

        function renderTagsInput() {
            const container = document.getElementById('tagsInput');
            const input = container.querySelector('input');
            container.innerHTML = currentTags.map(tag => `
                <span class="tag-item">
                    ${tag}
                    <button type="button" onclick="removeTag('${tag}')">&times;</button>
                </span>
            `).join('') + input.outerHTML;
        }

        function removeTag(tag) {
            currentTags = currentTags.filter(t => t !== tag);
            renderTagsInput();
        }

        function searchCatatan() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allCatatan.filter(c =>
                c.judul.toLowerCase().includes(search) ||
                c.konten.toLowerCase().includes(search) ||
                (c.tags && c.tags.some(tag => tag.toLowerCase().includes(search)))
            );
            renderCatatan(filtered);
        }

        function filterBySubject(subject) {
            currentFilter = subject;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            if (subject === 'all') {
                renderCatatan(allCatatan);
            } else {
                const filtered = allCatatan.filter(c => c.mataPelajaran === subject);
                renderCatatan(filtered);
            }
        }
    </script>
</body>
</html>
