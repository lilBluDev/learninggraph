<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/public/global.css"/>
    <link rel="stylesheet" href="/public/footer.css"/>
    <link rel="stylesheet" href="/public/daftarlogin.css"/>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <img src="/public/lglogo.png" alt="Logo"> 
        </div>
        <div class="logo-text">LearningGraph</div>
        <div class="social-icons">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="#"><i class="fas fa-search"></i></a>
        </div>
    </header>

    <!-- Yellow Bar -->
    <div class="yellow-bar">
        <a href="/" class="btn-kembali">← Kembali</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Background Logo -->
        <div class="background-logo">
            <img src="/public/lglogo.png" alt="Background Logo">
        </div>

        <!-- Create Account Form -->
        <div class="form-container" id="signupForm">
            <h2>Create an account</h2>
            <div class="success-message" id="registerSuccess"></div>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="registerName" placeholder="Nama Anda" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" placeholder="yourname@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword" placeholder="********" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('registerPassword', this)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <div class="form-group">
                    <label>Konfirmasi Password</label>
                    <input type="password" id="confirmPassword" placeholder="********" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <button type="submit" class="btn-primary">Create account</button>
                <div class="signup-link">
                    Already have an account? <a onclick="toggleForms()">Login</a>
                </div>
            </form>
        </div>

        <!-- Login Form -->
        <div class="form-container hidden" id="loginForm">
            <h2>Login to your account</h2>
            <div class="success-message" id="loginSuccess"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email atau Username</label>
                    <input type="text" id="loginEmail" placeholder="yourname@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="********" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <div class="forgot-link">
                    <a href="#">Forgot?</a>
                </div>
                <button type="submit" class="btn-primary">Login now</button>
                <div class="signin-link">
                    Don't have an account? <a onclick="toggleForms()">Sign up</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <komponen footer />

    <script src="/public/daftarlogin.js"></script>
</body>
</html>
