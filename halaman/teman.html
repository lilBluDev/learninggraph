<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearningGraph - Teman</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/public/global.css"/>
    <link rel="stylesheet" href="/public/sidebar.css"/>
    <link rel="stylesheet" href="/public/teman.css"/>
</head>
<body>
    <komponen sidebar />

    <main class="main-content">
        <section class="header">
            <h1><i class="fas fa-user-friends"></i> Teman</h1>
            <p class="muted">Kelola dan temukan teman belajar</p>
            <div class="action-bar">
                <input type="text" id="searchFriends" placeholder="Cari teman..." class="search-input">
                <button class="btn btn-primary" onclick="showAddFriendModal()"><i class="fas fa-user-plus"></i> Tambah Teman</button>
            </div>
            <div class="friends-grid" id="friendsGrid"></div>
            <div class="empty-state" id="emptyState" style="display:none;">
                <i class="fas fa-user-slash"></i>
                <p>Belum ada teman</p>
            </div>
        </section>
    </main>

    <script src="/public/sidebar.js"></script>
    <script src="/public/teman.js"></script>
</body>
</html>
